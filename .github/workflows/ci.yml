name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies and Build Cython Extensions
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel cython click rich tabulate pytest pytest-benchmark pytest-cov
          uv run python setup.py build_ext --inplace

      - name: Execute Full Pytest Test Suite
        run: |
          uv run pytest -v

      - name: Execute Caesura System Verification
        run: |
          uv run python -m caesura.cli.main verify

      - name: Run Engine Benchmark Smoke Test
        run: |
          uv run python -m caesura.benchmarks.suite
