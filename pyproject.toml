[build-system]
requires = ["setuptools>=68.0.0", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caesura"
version = "0.1.0"
description = "A high-throughput subword tokenization, finite-state lexical analysis, and zero-copy text encoding engine in Cython"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aneesh Krishna", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
caesura = "caesura.cli.main:cli"

[tool.setuptools]
packages = [
    "caesura",
    "caesura.core",
    "caesura.unicode",
    "caesura.regex",
    "caesura.trie",
    "caesura.models",
    "caesura.vocab",
    "caesura.trainers",
    "caesura.pipeline",
    "caesura.decoder",
    "caesura.io",
    "caesura.benchmarks",
    "caesura.cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
